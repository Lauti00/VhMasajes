spring.application.name=app
server.port=${PORT:8083}
spring.profiles.default=prod
app.time-zone=${APP_TIME_ZONE:America/Argentina/Buenos_Aires}
app.public-url=${APP_PUBLIC_URL:http://localhost:5173}

# WhatsApp Cloud API (optional: reservations still succeed if unset)
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.api-version=${WHATSAPP_API_VERSION:v27.0}
whatsapp.template-name=${WHATSAPP_TEMPLATE_NAME:vhmasajes_confirmacion_turno}
whatsapp.template-language=${WHATSAPP_TEMPLATE_LANGUAGE:es_AR}

# DATABASE
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/masajes;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 CONSOLE
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# LOGGING
logging.level.root=INFO
logging.level.com.masajes=DEBUG

# SECURITY & JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# SWAGGER
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
