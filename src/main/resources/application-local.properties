# Solo para desarrollo local. Producción debe usar el perfil prod y secretos del proveedor.
jwt.secret=${JWT_SECRET:local-development-only-never-use-in-production-0123456789-abcdefghijklmnopqrstuvwxyz}
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
INITIAL_ADMIN_EMAIL=${LOCAL_ADMIN_EMAIL:admin@masajes.local}
INITIAL_ADMIN_PASSWORD=${LOCAL_ADMIN_PASSWORD:local-only-change-on-first-use}
INITIAL_ADMIN_NAME=${LOCAL_ADMIN_NAME:Administrador local}
